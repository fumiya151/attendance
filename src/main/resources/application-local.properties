spring.application.name=attendance-app

# ローカルPostgreSQL Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/attendance_db 
spring.datasource.username=postgres
spring.datasource.password=root_pass

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# HikariCP コネクションプールの設定 (安定性確保のため)
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000 

# Hibernate Dialect の明示的な設定
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect