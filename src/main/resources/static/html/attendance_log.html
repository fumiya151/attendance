<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠管理システム - 勤怠ログ/修正</title>
    <link rel="stylesheet" href="../css/admin_common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/attendance_log.css">
</head>
<body>
    <div class="admin-dashboard">
        
        <aside class="sidebar">
            <h1 class="logo">勤怠管理</h1>
            <nav class="nav-menu">
                <a href="admin_main.html" class="nav-item" data-target="dashboard">
                    <i class="fas fa-chart-line"></i> ダッシュボード
                </a>
                <a href="employee_management.html" class="nav-item" data-target="employees">
                    <i class="fas fa-users"></i> 従業員管理
                </a>
                <a href="attendance_log.html" class="nav-item active" data-target="attendance-logs">
                    <i class="fas fa-clock"></i> 勤怠ログ/修正
                </a>
                <a href="payroll_calculation.html" class="nav-item" data-target="payroll">
                    <i class="fas fa-calculator"></i> 給与計算・集計
                </a>
                <a href="system_settings.html" class="nav-item" data-target="settings">
                    <i class="fas fa-cogs"></i> システム設定
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h2>勤怠ログ/修正</h2>
                <div class="user-info">
                    <span>管理者 (Admin)</span>
                    <a href="login.html" class="logout-btn">ログアウト</a>
                </div>
            </header>

            <section id="attendance-logs" class="content-view">
                <h3>勤怠ログ/修正</h3>
                <div class="action-bar">
                    <input type="text" placeholder="氏名、日付で検索..." class="search-input">
                    <button class="primary-btn"><i class="fas fa-search"></i> 検索</button>
                </div>
                
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>日付</th>
                            <th>氏名</th>
                            <th>出勤時刻</th>
                            <th>退勤時刻</th>
                            <th>ステータス</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>2025-10-02</td>
                            <td>佐藤 太郎</td>
                            <td>09:05</td>
                            <td>18:10</td>
                            <td><span class="status-approved">承認済</span></td>
                            <td>
                                <button class="small-btn edit-btn"><i class="fas fa-pen"></i> 修正依頼</button>
                            </td>
                        </tr>
                        <tr>
                            <td>2025-10-02</td>
                            <td>鈴木 次郎</td>
                            <td>08:58</td>
                            <td>19:30</td>
                            <td><span class="status-pending">修正依頼中</span></td>
                            <td>
                                <button class="small-btn approve-btn"><i class="fas fa-check"></i> 承認</button>
                                <button class="small-btn reject-btn"><i class="fas fa-times"></i> 否認</button>
                            </td>
                        </tr>
                        </tbody>
                </table>
            </section>

        </main>
    </div>
</body>
</html>
