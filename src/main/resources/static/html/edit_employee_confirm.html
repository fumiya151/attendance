<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠管理システム - 編集内容の確認</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/edit_employee_confirms.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="admin-dashboard">
        <aside class="sidebar">
            <h1 class="logo">勤 怠<br>管 理</h1>
            <nav class="nav-menu">
                <a href="admin_main.html" class="nav-item" data-target="dashboard">
                    <i class="fas fa-chart-line"></i> トップ
                </a>
                <a href="employee_management.html" class="nav-item active" data-target="employees">
                    <i class="fas fa-users"></i> 管理
                </a>
                <a href="attendance_log.html" class="nav-item" data-target="attendance-logs">
                    <i class="fas fa-clock"></i> 修正
                </a>
                <a href="payroll_calculation.html" class="nav-item" data-target="payroll">
                    <i class="fas fa-calculator"></i> 給与
                </a>
                <a href="system_settings.html" class="nav-item" data-target="settings">
                    <i class="fas fa-cogs"></i> 設定
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h2>編集内容の確認</h2>
            </header>

            <section class="content-view active">
                <h3>以下の内容で更新します。よろしいですか？</h3>

                <table class="confirmation-table">
                    <thead>
                        <tr>
                            <th>項目</th>
                            <th>変更前</th>
                            <th>変更後</th>
                        </tr>
                    </thead>
                    <tbody id="confirmation-tbody">
                        <!-- JSで内容をここに挿入 -->
                    </tbody>
                </table>

                <div class="form-actions">
                    <button id="confirm-btn" class="primary-btn">確定</button>
                    <button id="back-btn" class="secondary-btn">修正に戻る</button>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/edit_employee_confirm.js"></script>
</body>

</html>
