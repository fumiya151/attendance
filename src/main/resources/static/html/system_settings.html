<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠管理システム - システム設定</title>
    <link rel="stylesheet" href="../css/admin_common.css">
    <link rel="stylesheet" href="../css/system_settings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="admin-dashboard">
        
        <aside class="sidebar">
            <h1 class="logo">勤怠管理</h1>
            <nav class="nav-menu">
                <a href="admin_main.html" class="nav-item" data-target="dashboard">
                    <i class="fas fa-chart-line"></i> ダッシュボード
                </a>
                <a href="employee_management.html" class="nav-item" data-target="employees">
                    <i class="fas fa-users"></i> 従業員管理
                </a>
                <a href="attendance_log.html" class="nav-item" data-target="attendance-logs">
                    <i class="fas fa-clock"></i> 勤怠ログ/修正
                </a>
                <a href="payroll_calculation.html" class="nav-item" data-target="payroll">
                    <i class="fas fa-calculator"></i> 給与計算・集計
                </a>
                <a href="system_settings.html" class="nav-item active" data-target="settings">
                    <i class="fas fa-cogs"></i> システム設定
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h2>システム設定</h2>
                <div class="user-info">
                    <span>管理者 (Admin)</span>
                    <a href="login.html" class="logout-btn">ログアウト</a>
                </div>
            </header>

            <section id="settings" class="content-view active">
                <div class="card-grid">
                    <div class="card settings-card">
                        <h3 class="card-title">全般設定</h3>
                        <div class="setting-item">
                            <label for="company-name">会社名</label>
                            <input type="text" id="company-name" value="勤怠管理株式会社" class="form-input">
                        </div>
                        <div class="setting-item">
                            <label for="default-work-hours">標準労働時間</label>
                            <input type="number" id="default-work-hours" value="8" class="form-input"> 時間/日
                        </div>
                        <div class="setting-item">
                            <label for="overtime-rate">残業手当率</label>
                            <input type="number" id="overtime-rate" value="1.25" step="0.01" class="form-input">
                        </div>
                        <button class="primary-btn mt-10">保存</button>
                    </div>
                    <div class="card settings-card">
                        <h3 class="card-title">マスターデータ管理</h3>
                        <div class="master-data-links">
                            <a href="#" class="master-data-link">部署マスター</a>
                            <a href="#" class="master-data-link">役職マスター</a>
                            <a href="#" class="master-data-link">休暇種別マスター</a>
                        </div>
                    </div>
                     <div class="card settings-card">
                        <h3 class="card-title">通知設定</h3>
                        <div class="setting-item">
                            <label for="notification-email">通知先メールアドレス</label>
                            <input type="email" id="notification-email" value="admin@example.com" class="form-input">
                        </div>
                         <div class="setting-item checkbox-item">
                             <input type="checkbox" id="enable-notifications" checked>
                             <label for="enable-notifications">勤怠修正依頼の通知を有効にする</label>
                         </div>
                        <button class="primary-btn mt-10">保存</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
