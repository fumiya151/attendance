<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠管理システム - ログイン</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">勤怠管理</h1>
            <div class="tab-container">
                <div class="tab-item active" data-role="user">打刻画面</div>
                <div class="tab-item" data-role="admin">管理者画面</div>
            </div>
            <form id="login-form">
                <input type="hidden" id="login-role" name="role" value="user">
                <div class="input-group">
                    <label for="username">ユーザーID</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">パスワード</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <p id="error-message" style="color: red; text-align: center;"></p>
                <button type="submit" class="login-button">ログイン</button>
            </form>
        </div>
    </div>
    <script src="../js/login.js" defer></script>
</body>
</html>
