<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠管理システム - 給与計算・集計</title>
    <link rel="stylesheet" href="../css/admin_common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="admin-dashboard">
        
        <aside class="sidebar">
            <h1 class="logo">勤怠管理</h1>
            <nav class="nav-menu">
                <a href="admin_main.html" class="nav-item" data-target="dashboard">
                    <i class="fas fa-chart-line"></i> ダッシュボード
                </a>
                <a href="employee_management.html" class="nav-item" data-target="employees">
                    <i class="fas fa-users"></i> 従業員管理
                </a>
                <a href="attendance_log.html" class="nav-item" data-target="attendance-logs">
                    <i class="fas fa-clock"></i> 勤怠ログ/修正
                </a>
                <a href="payroll_calculation.html" class="nav-item active" data-target="payroll">
                    <i class="fas fa-calculator"></i> 給与計算・集計
                </a>
                <a href="system_settings.html" class="nav-item" data-target="settings">
                    <i class="fas fa-cogs"></i> システム設定
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h2>給与計算・集計</h2>
                <div class="user-info">
                    <span>管理者 (Admin)</span>
                    <a href="login.html" class="logout-btn">ログアウト</a>
                </div>
            </header>

            <section id="payroll" class="content-view">
                <h3>給与計算・勤務時間集計</h3>
                <div class="card-grid">
                    <div class="card info-card">
                        <p class="card-title">集計対象期間</p>
                        <select class="form-select">
                            <option>2025年10月度</option>
                            <option>2025年9月度</option>
                        </select>
                        <button class="primary-btn mt-10">集計実行</button>
                    </div>
                    
                    <div class="card summary-card">
                        <p class="card-title">全従業員の総労働時間</p>
                        <p class="card-value">1,560 時間</p>
                    </div>
                    <div class="card summary-card">
                        <p class="card-title">平均残業時間（月）</p>
                        <p class="card-value red">18.5 時間</p>
                    </div>
                </div>

                <h4>集計結果一覧</h4>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>氏名</th>
                            <th>総労働時間</th>
                            <th>残業時間</th>
                            <th>深夜時間</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>佐藤 太郎</td>
                            <td>160:00</td>
                            <td>10:00</td>
                            <td>2:30</td>
                            <td><button class="small-btn export-btn">明細出力</button></td>
                        </tr>
                        </tbody>
                </table>
            </section>

        </main>
    </div>
</body>
</html>
