<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠管理システム - 給与計算・集計</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="admin-dashboard">

        <aside class="sidebar">
            <h1 class="logo">勤怠管理</h1>
            <nav class="nav-menu">
                <a href="admin_main.html" class="nav-item" data-target="dashboard">
                    <i class="fas fa-chart-line"></i> ダッシュボード
                </a>
                <a href="employee_management.html" class="nav-item" data-target="employees">
                    <i class="fas fa-users"></i> 従業員管理
                </a>
                <a href="attendance_log.html" class="nav-item" data-target="attendance-logs">
                    <i class="fas fa-clock"></i> 勤怠ログ/修正
                </a>
                <a href="payroll_calculation.html" class="nav-item active" data-target="payroll">
                    <i class="fas fa-calculator"></i> 給与計算・集計
                </a>
                <a href="system_settings.html" class="nav-item" data-target="settings">
                    <i class="fas fa-cogs"></i> システム設定
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h2>給与計算・集計</h2>
                <div class="user-info">
                    <span>管理者 (Admin)</span>
                    <a href="admin_login.html" class="logout-btn">ログアウト</a>
                </div>
            </header>

            <section id="payroll" class="content-view active">
                <h3>給与計算・勤務時間集計</h3>
                <div class="action-bar">
                    <label for="start-date-input" style="font-weight: bold;">期間:</label>
                    <input type="date" id="start-date-input" class="form-input"
                        style="width: 150px; margin-right: 5px;">
                    <span style="margin-right: 5px;">〜</span>
                    <input type="date" id="end-date-input" class="form-input" style="width: 150px; margin-right: 15px;">

                    <button id="calculate-btn" class="primary-btn"><i class="fas fa-sync-alt"></i> 給与計算を実行</button>
                    <button class="secondary-btn"><i class="fas fa-file-export"></i> CSV出力</button>
                </div>

                <h4>集計結果一覧</h4>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>従業員ID</th>
                            <th>氏名</th>
                            <th>合計労働時間 (h)</th>
                            <th>計算給与 (円)</th>
                        </tr>
                    </thead>
                    <tbody id="payroll-table-body">
                    </tbody>
                </table>
            </section>

        </main>
    </div>
    <script src="../js/payroll_calculation.js"></script>
</body>

</html>
