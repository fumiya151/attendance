<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠管理システム - 従業員編集</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="admin-dashboard">

        <aside class="sidebar">
            <h1 class="logo">勤怠管理</h1>
            <nav class="nav-menu">
                <a href="admin_main.html" class="nav-item" data-target="dashboard">
                    <i class="fas fa-chart-line"></i> ダッシュボード
                </a>
                <a href="employee_management.html" class="nav-item active" data-target="employees">
                    <i class="fas fa-users"></i> 従業員管理
                </a>
                <a href="attendance_log.html" class="nav-item" data-target="attendance-logs">
                    <i class="fas fa-clock"></i> 勤怠ログ/修正
                </a>
                <a href="payroll_calculation.html" class="nav-item" data-target="payroll">
                    <i class="fas fa-calculator"></i> 給与計算・集計
                </a>
                <a href="system_settings.html" class="nav-item" data-target="settings">
                    <i class="fas fa-cogs"></i> システム設定
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h2>従業員情報の編集</h2>
                <div class="user-info">
                    <span>管理者 (Admin)</span>
                    <a href="admin_login.html" class="logout-btn">ログアウト</a>
                </div>
            </header>

            <section class="content-view active">
                <h3>編集フォーム</h3>
                <form id="employee-edit-form" class="form-container">
                    <div class="form-group">
                        <label for="employeeId">従業員コード</label>
                        <input type="text" id="employeeId" name="employeeId" class="form-input" readonly>
                        <small>従業員コードは変更できません。</small>
                    </div>
                    <div class="form-group">
                        <label for="name">氏名</label>
                        <input type="text" id="name" name="name" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="roleSelect">役職（権限）</label>
                        <select id="roleSelect" name="roleSelect" class="form-input" required>
                            <option value="" disabled>選択してください</option>
                            <option value="1" data-department="オーナー">オーナー</option>
                            <option value="1" data-department="マネージャー">マネージャー</option>
                            <option value="2" data-department="店長">店長</option>
                            <option value="3" data-department="従業員">従業員</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="email">メールアドレス</label>
                        <input type="email" id="email" name="email" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>在職状況</label>
                        <div class="radio-group">
                            <label><input type="radio" name="isActive" value="true" checked> 在職中</label>
                            <label><input type="radio" name="isActive" value="false"> 退職</label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="primary-btn">確認画面へ</button>
                        <a href="employee_management.html" class="secondary-btn">キャンセル</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
    <script src="../js/edit_employee.js"></script>
</body>

</html>
