<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠管理システム - 管理画面</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="admin-dashboard">

        <aside class="sidebar">
            <h1 class="logo">勤 怠<br>管 理</h1>
            <nav class="nav-menu">
                <a href="admin_main.html" class="nav-item active" data-target="dashboard">
                    <span class="nav-icon-wrapper"><i class="fas fa-chart-line"></i></span> 
                    <span class="nav-text">トップ</span>
                </a>
                <a href="employee_management.html" class="nav-item" data-target="employees">
                    <span class="nav-icon-wrapper"><i class="fas fa-users"></i></span> 
                    <span class="nav-text">管理</span>
                </a>
                <a href="attendance_log.html" class="nav-item" data-target="attendance-logs">
                    <span class="nav-icon-wrapper"><i class="fas fa-clock"></i></span> 
                    <span class="nav-text">勤怠</span>
                </a>
                <a href="payroll_calculation.html" class="nav-item" data-target="payroll">
                    <span class="nav-icon-wrapper"><i class="fas fa-calculator"></i></span> 
                    <span class="nav-text">給与</span>
                </a>
                <a href="system_settings.html" class="nav-item" data-target="settings">
                    <span class="nav-icon-wrapper"><i class="fas fa-cogs"></i></span> 
                    <span class="nav-text">設定</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h2>トップ</h2>
                <div class="user-info">
                    <span>管理者 (Admin)</span>
                    <a href="admin_login.html" class="logout-btn">ログアウト</a>
                </div>
            </header>

            <section id="employees" class="content-view active">
                <h3>従業員マスタ管理</h3>
                <div class="action-bar">
                    <input type="text" id="employee-search-input" placeholder="氏名、コードで検索..." class="search-input">
                    <button class="primary-btn" id="employee-search-btn"><i class="fas fa-search"></i> 検索</button>
                    <a href="register_employee.html" class="primary-btn"><i class="fas fa-plus"></i> 新規従業員登録</a>
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>氏名</th>
                            <th>役職</th>
                            <th>メールアドレス</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="employee-insert-point"></tr>
                    </tbody>
                </table>
            </section>

            <section id="payroll" class="content-view">
                <h3>勤務時間集計</h3>
                <div class="card-grid">
                    <div class="card info-card">
                        <p class="card-title">集計対象期間</p>
                        <select class="form-select" id="aggregation-period-select">
                        </select>
                        <button class="primary-btn mt-10" id="execute-aggregation-btn">集計実行</button>
                    </div>

                    <div class="card summary-card">
                        <p class="card-title">全従業員の総労働時間</p>
                        <p class="card-value" id="total-work-hours">- 時間</p>
                    </div>
                    <div class="card summary-card">
                        <p class="card-title">平均残業時間（月）</p>
                        <p class="card-value red" id="average-overtime">- 時間</p>
                    </div>
                </div>

                <h4>集計結果一覧</h4>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>氏名</th>
                            <th>総労働時間</th>
                            <th>残業時間</th>
                            <th>深夜時間</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="payroll-results-body">
                        </tbody>
                </table>
            </section>

            <section id="attendance-logs" class="content-view">
                <h3>勤怠</h3>
                <div class="action-bar">
                    <label for="search-month">対象月:</label>
                    <select id="search-month" class="search-select">
                        <option value="">--- 全期間 ---</option>
                        </select>

                    <label for="search-employee">従業員名:</label>
                    <select id="search-employee" class="search-select">
                        <option value="">--- 全従業員 ---</option>
                        </select>

                    <button class="primary-btn" id="search-button"><i class="fas fa-search"></i> 検索</button>
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>日付</th>
                            <th>氏名</th>
                            <th>出勤時刻</th>
                            <th>休憩時間</th>
                            <th>退勤時刻</th>
                            <th>承認状態</th> 
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </section>

            <section id="settings" class="content-view">
                <h3>設定</h3>
                <div class="card-grid">
                    <div class="card settings-card">
                        <p class="card-title">全般設定</p>
                        <div class="setting-item">
                            <label for="company-name">会社名</label>
                            <input type="text" id="company-name" value="勤怠管理株式会社" class="form-input">
                        </div>
                        <div class="setting-item">
                            <label for="default-work-hours">標準労働時間</label>
                            <input type="number" id="default-work-hours" value="8" class="form-input"> 時間/日
                        </div>
                        <button class="primary-btn mt-10">保存</button>
                    </div>
                    <div class="card settings-card">
                        <p class="card-title">マスターデータ管理</p>
                        <div class="master-data-links">
                            <a href="#" class="master-data-link">部署マスター</a>
                            <a href="#" class="master-data-link">役職マスター</a>
                            <a href="#" class="master-data-link">休暇種別マスター</a>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        </div>
    <script src="../js/admin_main.js"></script>
</body>

</html>
